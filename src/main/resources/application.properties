# Port Aplikasi
server.port=8080

# Konfigurasi Database H2 agar Camunda Engine tidak error
spring.datasource.url=jdbc:h2:mem:camunda-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Konfigurasi Camunda Auto-Deployment
camunda.bpm.database.type=h2
camunda.bpm.job-execution.enabled=false
camunda.bpm.generic-properties.properties.enforce-history-time-to-live=false

# Akun Admin Default Camunda Webapp (Cockpit, Tasklist, Admin)
camunda.bpm.admin-user.id=admin
camunda.bpm.admin-user.password=admin
camunda.bpm.admin-user.first-name=Siti
camunda.bpm.admin-user.last-name=Dibaj
camunda.bpm.admin-user.email=sitidibaj117@mhs.uinjkt.ac.id
camunda.bpm.webapp.index-redirect-enabled=true